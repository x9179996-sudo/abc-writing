<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABC 寫字本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：練習簿 — 左邊是一大格四線格「寫字板」，右邊是小老師提示與按鈕；手機改成上下排 */
:root{
  --bg:#EAF2EF; --paper:#FFFFFF; --ink:#1E2B37; --muted:#56666F;
  --line:#8A99A4; --base:#44525C; --band:#FFF5D6;
  --accent:#EE7A16; --on-accent:#FFFFFF; --teal:#11806F; --gold:#F2B705;
  --bad:#D3443A; --track:#D9E2E6; --dash:#7F8D97; --user:#2C52CF; --tpen:#D3443A;
  --chip:#DCE8E4; --chip-on:#1E2B37; --on-chip-on:#FFFFFF;
  --shadow:0 6px 20px rgba(30,43,55,.10);
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  --font-display:"Fredoka","Noto Sans TC","PingFang TC",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111C1A; --paper:#1A2826; --ink:#EAF2EF; --muted:#A4B5B0;
  --line:#6E837E; --base:#BACAC5; --band:#232A20;
  --accent:#FF9442; --on-accent:#1A1206; --teal:#3DC4AF; --gold:#FFCB2E;
  --bad:#FF6A5C; --track:#2C3E3B; --dash:#8CA19C; --user:#88A8FF; --tpen:#FF7C70;
  --chip:#243532; --chip-on:#EAF2EF; --on-chip-on:#111C1A;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111C1A; --paper:#1A2826; --ink:#EAF2EF; --muted:#A4B5B0;
  --line:#6E837E; --base:#BACAC5; --band:#232A20;
  --accent:#FF9442; --on-accent:#1A1206; --teal:#3DC4AF; --gold:#FFCB2E;
  --bad:#FF6A5C; --track:#2C3E3B; --dash:#8CA19C; --user:#88A8FF; --tpen:#FF7C70;
  --chip:#243532; --chip-on:#EAF2EF; --on-chip-on:#111C1A;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:20px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;margin:0}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{max-width:1180px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 22px;border-radius:16px;
  background:var(--chip);font-weight:700;font-size:20px;transition:transform .08s;text-decoration:none;box-sizing:border-box}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:2px solid var(--chip)}
.btn.small{min-height:44px;font-size:17px;padding:6px 14px}

/* ---------- 首頁 ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-size:clamp(36px,6.5vw,64px);margin:0;line-height:1;letter-spacing:.01em}
.brand h1 .o{color:var(--accent)} .brand h1 .t{color:var(--teal)}
.brand p{margin:0;font-size:20px;color:var(--muted);font-weight:700}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.lead{font-size:22px;font-weight:700;margin:18px 0 14px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.tile{position:relative;background:var(--paper);border-radius:20px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);min-height:132px;cursor:pointer;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .pair{font-family:var(--font-display);font-size:46px;font-weight:600;line-height:1}
.tile .pair span+span{color:var(--teal);margin-left:2px}
.tile .mini{display:flex;gap:2px}
.tile .mini svg{width:16px;height:16px}
.tile.done{outline:3px solid var(--gold)}
.tile .stk{position:absolute;top:-10px;right:-6px;font-size:32px;line-height:1}
.book{margin-top:26px;background:var(--paper);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow)}
.book h2{margin:0 0 10px;font-size:24px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.slot{height:100px;border-radius:18px;border:3px dashed var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot .e{font-size:42px;line-height:1.1}
.slot .l{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--muted)}
.slot.got{border:3px solid var(--gold);background:var(--band)}
.slot:not(.got) .e{filter:grayscale(1);opacity:.25}
.foot{margin-top:22px;font-size:17px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.foot p{margin:0;max-width:60ch}

/* ---------- 練習頁 ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.pair-title{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1}
.pair-title span+span{color:var(--teal)}
.seg-group{display:inline-flex;background:var(--chip);border-radius:18px;padding:5px;gap:4px}
.seg{min-height:50px;padding:4px 18px;border-radius:14px;font-weight:700;font-size:20px}
.seg.on{background:var(--chip-on);color:var(--on-chip-on)}
.seg .lt{font-family:var(--font-display);font-size:26px;margin-left:4px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stage{background:var(--paper);border-radius:16px;min-height:64px;padding:6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1.2;box-shadow:var(--shadow);border:3px solid transparent}
.stage.on{border-color:var(--accent)}
.stage svg{width:22px;height:22px}
.work{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.board-wrap{background:var(--paper);border-radius:26px;box-shadow:var(--shadow);padding:8px;display:flex;justify-content:center}
.board{width:100%;max-height:72vh;aspect-ratio:300/380;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.board.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.side{display:flex;flex-direction:column;gap:14px}
.coach{background:var(--paper);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);min-height:132px}
.coach .msg{font-size:24px;font-weight:700;line-height:1.45}
.coach .msg.bad{color:var(--bad)}
.coach .msg.good{color:var(--teal)}
.coach .sub{margin-top:6px;font-size:18px;color:var(--muted);font-weight:700}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side-actions .wide{grid-column:1/-1}
.case-stars{background:var(--paper);border-radius:22px;padding:12px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:18px}
.case-stars .row{display:flex;align-items:center;gap:8px}
.case-stars .row b{font-family:var(--font-display);font-size:28px;min-width:30px}
.case-stars svg{width:28px;height:28px}

/* 四線格與筆畫 */
.band{fill:var(--band)}
.gdot{stroke:var(--line);stroke-width:2.6;stroke-dasharray:1.5 8;stroke-linecap:round}
.gbase{stroke:var(--base);stroke-width:3}
.trk{fill:none;stroke:var(--track);stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.dsh{fill:none;stroke:var(--dash);stroke-width:4.5;stroke-dasharray:2 10;stroke-linecap:round;stroke-linejoin:round}
.trk-dot{fill:var(--track);stroke:none}
.dsh-dot{fill:none;stroke:var(--dash);stroke-width:4;stroke-dasharray:3 5}
.demo{fill:none;stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.ghost{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
.ink{fill:none;stroke:var(--user);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.ink.ok{stroke:var(--teal)}
.ink.bad{stroke:var(--bad);transition:opacity .6s .25s}
.ink.fade{opacity:0}
.dot-fill{stroke:none!important}
.demo.dot-fill{fill:var(--ink)}
.ghost.dot-fill{fill:var(--accent);opacity:.45}
.ink.ok.dot-fill{fill:var(--teal)}
.tpen.dot-fill{fill:var(--tpen)}
.demo.dot-anim{fill:var(--ink);stroke:none}
.ghost.dot-anim{fill:var(--accent);stroke:none;opacity:.6}
.tpen{fill:none;stroke:var(--tpen);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.mk-c{fill:var(--accent)}
.mk-ring{fill:none;stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.mk-t{fill:var(--on-accent);font:700 17px var(--font-display);text-anchor:middle;dominant-baseline:central}
.mk-a{fill:var(--accent)}
.mk-n{fill:var(--paper);stroke:var(--accent);stroke-width:2.5}
.mk-nt{fill:var(--accent);font:700 15px var(--font-display);text-anchor:middle;dominant-baseline:central}

/* ---------- 老師模式 ---------- */
#teacher{min-height:100%}
.t-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.t-chips{display:flex;gap:6px;flex-wrap:wrap;max-height:180px;overflow-y:auto;padding:2px}
.t-chip{min-width:62px;min-height:48px;border-radius:14px;background:var(--chip);font-family:var(--font-display);font-size:24px;font-weight:600}
.t-chip.on{background:var(--chip-on);color:var(--on-chip-on)}
.t-stage{background:var(--paper);border-radius:28px;box-shadow:var(--shadow);display:flex;justify-content:center;position:relative;padding:6px}
.t-stage svg{height:min(65vh,800px);width:auto;max-width:100%;aspect-ratio:300/380;touch-action:none}
.t-count{position:absolute;top:14px;left:18px;font-size:24px;font-weight:900;color:var(--muted)}
.t-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.t-controls .btn{min-height:56px;font-size:20px;padding:6px 18px}
.btn.on{background:var(--chip-on);color:var(--on-chip-on)}

/* ---------- 慶祝 ---------- */
#celebrate{position:fixed;inset:0;z-index:50;background:rgba(15,25,23,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cele-card{position:relative;background:var(--paper);border-radius:30px;padding:26px 26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.cele-big{font-size:96px;line-height:1.1}
.cele-big svg{width:120px;height:120px}
.cele-title{font-size:32px;font-weight:900;margin:6px 0 2px}
.cele-sub{font-size:20px;color:var(--muted);font-weight:700;margin-bottom:16px}
.cele-btns{display:flex;flex-direction:column;gap:10px}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:51;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- 練習單預覽 ---------- */
#sheetModal{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sm-head{max-width:820px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sm-head h2{margin:0;font-size:26px}
.sm-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sm-pages{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-wrap{overflow:hidden;border-radius:6px;box-shadow:var(--shadow)}
.page-wrap .page{transform-origin:0 0}

/* A4 練習單（列印用，固定黑白） */
.page{width:210mm;height:297mm;padding:12mm 12mm 10mm;background:#fff;color:#111;display:flex;flex-direction:column;gap:2mm;overflow:hidden;font-family:var(--font-ui)}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.6mm solid #111;padding-bottom:2mm}
.p-title{font-size:20pt;font-weight:900}
.p-title b{font-family:var(--font-display);font-size:30pt;margin-left:2mm}
.p-name{font-size:13pt;font-weight:700;white-space:nowrap}
.p-tip{font-size:11pt;color:#333;font-weight:700}
.p-sec{font-size:13pt;font-weight:900;margin-top:2mm}
.p-sec b{font-family:var(--font-display);font-size:18pt}
.p-row{display:grid;grid-template-columns:15mm 1fr;align-items:center;gap:1mm}
.p-lab{font-size:11pt;font-weight:900;color:#333;text-align:center;line-height:1.2}
.prow{width:100%;display:block}
.p-dot{stroke:#8d969c;stroke-width:3;stroke-dasharray:2 10;stroke-linecap:round}
.p-base{stroke:#333;stroke-width:3.5}
.p-trace{fill:none;stroke:#c4cbd0;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.p-dash{fill:none;stroke:#7d868c;stroke-width:5;stroke-dasharray:2 12;stroke-linecap:round;stroke-linejoin:round}
.p-model,.p-done{fill:none;stroke:#222;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.p-cur{fill:none;stroke:#E8730C;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.p-nc{fill:#E8730C}
.p-nt{fill:#fff;font:700 20px "Fredoka","Noto Sans TC",sans-serif;text-anchor:middle;dominant-baseline:central}
.p-sd{fill:#E8730C}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  :root{padding:0!important}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  #app,#celebrate,#sheetModal{display:none!important}
  #printArea{display:block!important}
  .page{break-after:page;page-break-after:always}
}

#measure{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}

@media (max-width:820px){
  body{font-size:19px}
  .work{grid-template-columns:1fr}
  .board{max-height:none}
  .pair-title{font-size:42px}
  .stage{font-size:15px;min-height:56px;padding:4px 2px}
  .side-actions{grid-template-columns:1fr}
  .head-actions{width:100%}
  .head-actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  .mk-ring,.confetti{animation:none;display:none}
  .cele-card{animation:none}
}
</style>
</head>
<body>
<svg id="measure" aria-hidden="true"></svg>

<div id="app">
  <!-- 首頁：字母牆 -->
  <section id="home">
    <div class="home-head">
      <div class="brand">
        <h1>A<span class="o">B</span><span class="t">C</span> 寫字本</h1>
        <p>一年級字母大小寫書寫練習</p>
      </div>
      <div class="head-actions">
        <button class="btn" id="toTeacher">老師示範模式</button>
        <button class="btn" id="allSheets">A4 練習單</button>
      </div>
    </div>
    <p class="lead">選一個字母，跟著筆順寫寫看！每組寫完可以得到 6 顆星星和 1 張貼紙。</p>
    <div class="wall" id="wall"></div>
    <div class="book">
      <h2>我的貼紙本　<span id="stkCount">0</span> / 26</h2>
      <div class="slots" id="slots"></div>
    </div>
    <div class="foot">
      <p>星星紀錄只存在這台裝置上。</p>
      <button class="btn small ghost" id="resetBtn">清除這台裝置的紀錄</button>
    </div>
  </section>

  <!-- 練習頁 -->
  <section id="practice" hidden>
    <div class="topbar">
      <button class="btn ghost" id="backHome">← 字母牆</button>
      <div class="pair-title" id="pairTitle"><span>A</span><span>a</span></div>
      <div class="seg-group" role="group" aria-label="大寫或小寫">
        <button class="seg on" id="segU">大寫<span class="lt" id="segUL">A</span></button>
        <button class="seg" id="segL">小寫<span class="lt" id="segLL">a</span></button>
      </div>
    </div>
    <div class="stages" id="stages"></div>
    <div class="work">
      <div class="board-wrap"><svg id="board" class="board" aria-label="寫字板"></svg></div>
      <aside class="side">
        <div class="coach"><div class="msg" id="coachMsg"></div><div class="sub" id="coachSub"></div></div>
        <div class="side-actions">
          <button class="btn primary wide" id="nextBtn" hidden>開始寫 →</button>
          <button class="btn" id="replayBtn">再看一次筆順</button>
          <button class="btn" id="restartBtn">重寫這一關</button>
          <button class="btn wide" id="sheetBtn">這一組的 A4 練習單</button>
        </div>
        <div class="case-stars" id="caseStars"></div>
      </aside>
    </div>
  </section>

  <!-- 老師示範模式 -->
  <section id="teacher" hidden>
    <div class="t-top">
      <div class="t-chips" id="tChips"></div>
      <div class="seg-group" role="group" aria-label="大寫或小寫">
        <button class="seg on" id="tSegU">大寫</button>
        <button class="seg" id="tSegL">小寫</button>
      </div>
      <button class="btn ghost" id="tExit">離開示範</button>
    </div>
    <div class="t-stage"><svg id="tboard" aria-label="示範板"></svg><div class="t-count" id="tCount"></div></div>
    <div class="t-controls">
      <button class="btn" id="tPrev">◀ 上一筆</button>
      <button class="btn primary" id="tNext">下一筆 ▶</button>
      <button class="btn" id="tAll">完整播放</button>
      <button class="btn" id="tGuide">虛線字</button>
      <button class="btn" id="tPen">白板筆</button>
      <button class="btn" id="tClear">清除筆跡</button>
      <button class="btn" id="tFull">全螢幕</button>
    </div>
  </section>
</div>

<div id="celebrate" hidden></div>
<div id="sheetModal" hidden>
  <div class="sm-head">
    <h2>A4 練習單</h2>
    <div class="sm-actions">
      <select id="sheetSelect" class="btn small ghost" aria-label="選擇字母組"></select>
      <button class="btn primary small" id="smPrint">列印</button>
      <button class="btn small" id="smClose">關閉</button>
    </div>
  </div>
  <div class="sm-pages" id="smPages"></div>
</div>
<div id="printArea"></div>

<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";

/* 筆畫資料：四線格座標，第1線 y=0、第2線 y=100、第3線（實線基線）y=200、第4線 y=300。陣列順序就是筆順。
   修改時請與 overview.html 保持同步 */
const LET = {
  A:{w:170,review:false,s:["M85 0 L8 200","M85 0 L162 200","M33 135 L137 135"]},
  B:{w:150,review:true,s:["M18 0 L18 200","M18 0 L78 0 A48 48 0 0 1 78 96 L18 96 L88 96 A52 52 0 0 1 88 200 L18 200"]},
  C:{w:150,review:false,s:["M135 45 C120 15 95 0 75 0 C30 0 15 45 15 100 C15 155 30 200 75 200 C95 200 120 185 135 155"]},
  D:{w:150,review:false,s:["M20 0 L20 200","M20 0 C80 0 135 40 135 100 C135 160 80 200 20 200"]},
  E:{w:140,review:true,s:["M20 0 L20 200","M20 0 L125 0","M20 100 L105 100","M20 200 L125 200"]},
  F:{w:135,review:false,s:["M20 0 L20 200","M20 0 L125 0","M20 100 L100 100"]},

/* ---------- 路徑量測 ---------- */
const cache = {};
function info(d){
  if(d && d.dot){
    return { len: 0, pts: [d.dot], start: d.dot, arrow: [d.dot[0], d.dot[1], 0], isDot: true, dot: d.dot };
  }
  if(cache[d]) return cache[d];
  const p = el("path",{d}, $("measure"));
  const len = p.getTotalLength();
  const n = Math.max(2, Math.ceil(len/3));
  const pts = [];
  for(let i=0;i<=n;i++){ const q=p.getPointAtLength(len*i/n); pts.push([q.x,q.y]); }
  const la = Math.min(len*0.42, 40);
  const a1 = p.getPointAtLength(la), a2 = p.getPointAtLength(Math.min(len, la+6));
  const ang = Math.atan2(a2.y-a1.y, a2.x-a1.x)*180/Math.PI;
  p.remove();
  return cache[d] = {len, pts, start:pts[0], arrow:[a1.x,a1.y,ang], isDot: false};
}

let actx=null;
function tone(fs, dur, type, gap){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||"sine"; o.frequency.value=f; const s=t0+i*(gap||.09);
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.18,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+dur);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+dur+.05); });
  }catch(e){}
}

class Board{
  constructor(svg){
    this.svg=svg; svg.setAttribute("viewBox","0 -40 300 380");
    const g=el("g",{},svg);
    el("rect",{x:0,y:100,width:300,height:100,class:"band"},g);
    [0,100,300].forEach(y=>el("line",{x1:0,x2:300,y1:y,y2:y,class:"gdot"},g));
    el("line",{x1:0,x2:300,y1:200,y2:200,class:"gbase"},g);
    this.root=el("g",{},svg);
    this.L={}; ["guide","done","anim","mark","live"].forEach(k=>this.L[k]=el("g",{},this.root));
    this.canDraw=()=>false; this.onStroke=null; this.cur=null; this.runId=0;
    svg.addEventListener("pointerdown",e=>this.down(e));
    svg.addEventListener("pointermove",e=>this.move(e));
    svg.addEventListener("pointerup",e=>this.up(e));
    svg.addEventListener("pointercancel",e=>this.up(e));
  }
  setLetter(ch){ this.ch=ch; this.tx=(300-LET[ch].w)/2; this.root.setAttribute("transform",`translate(${this.tx} 0)`); this.stop(); Object.values(this.L).forEach(g=>g.replaceChildren()); }
  clear(k){ this.L[k].replaceChildren(); }
  strokes(){ return LET[this.ch].s; }
  guide(level){
    this.clear("guide");
    if(!level) return;
    this.strokes().forEach(d=>{
      if(d && d.dot){
        if(level===1) el("circle",{cx:d.dot[0],cy:d.dot[1],r:14,class:"trk-dot"},this.L.guide);
        else el("circle",{cx:d.dot[0],cy:d.dot[1],r:14,class:"dsh-dot"},this.L.guide);
      } else {
        el("path",{d,class:level===1?"trk":"dsh"},this.L.guide);
      }
    });
  }
  staticStroke(i,cls,layer){
    const d=this.strokes()[i];
    if(d && d.dot){
      return el("circle",{cx:d.dot[0],cy:d.dot[1],r:14,class:cls+" dot-fill"},this.L[layer||"anim"]);
    }
    return el("path",{d,class:cls},this.L[layer||"anim"]);
  }
  marker(i, layer){
    const g=this.L[layer||"mark"]; if(!layer) this.clear("mark");
    const d=this.strokes()[i];
    if(d && d.dot){
      const [x,y]=d.dot;
      el("circle",{cx:x,cy:y,r:14,class:"mk-ring"},g);
      el("circle",{cx:x,cy:y,r:15,class:"mk-c"},g);
      const t=el("text",{x,y:y+1,class:"mk-t"},g); t.textContent=i+1;
      return;
    }
    const f=info(d); const [x,y]=f.start; const [ax,ay,ang]=f.arrow;
    el("polygon",{points:"-9,-9 11,0 -9,9",class:"mk-a",transform:`translate(${ax} ${ay}) rotate(${ang})`},g);
    el("circle",{cx:x,cy:y,r:14,class:"mk-ring"},g);
    el("circle",{cx:x,cy:y,r:15,class:"mk-c"},g);
    const t=el("text",{x,y:y+1,class:"mk-t"},g); t.textContent=i+1;
  }
  numbers(){
    this.clear("mark"); const used=[];
    this.strokes().forEach((d,i)=>{
      let [x,y]=(d && d.dot)?d.dot:info(d).start;
      while(used.some(([ux,uy])=>Math.hypot(ux-x,uy-y)<26)) x+=28;
      used.push([x,y]); el("circle",{cx:x,cy:y,r:13,class:"mk-n"},this.L.mark);
      const t=el("text",{x,y:y+1,class:"mk-nt"},this.L.mark); t.textContent=i+1;
    });
  }
  stop(){ this.runId++; }
  animate(i, cls, speed){
    const id=this.runId; const d=this.strokes()[i];
    if(d && d.dot){
      const [cx,cy]=d.dot;
      const c=el("circle",{cx,cy,r:0,class:cls+" dot-anim"},this.L.anim);
      const dur=380;
      return new Promise(res=>{ const t0=performance.now();
        const step=now=>{ if(id!==this.runId){ c.remove(); return res(false); }
          const k=Math.min(1,(now-t0)/dur); c.setAttribute("r",(14*k).toFixed(1));
          if(k<1) requestAnimationFrame(step); else { c.setAttribute("r","14"); res(true); } };
        requestAnimationFrame(step); });
    }
    const len=info(d).len;
    const p=el("path",{d,class:cls},this.L.anim);
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    const dur = Math.max(380, len/(speed||230)*1000);
    return new Promise(res=>{ const t0=performance.now();
      const step=now=>{ if(id!==this.runId){ p.remove(); return res(false); }
        const k=Math.min(1,(now-t0)/dur); p.style.strokeDashoffset=len*(1-k);
        if(k<1) requestAnimationFrame(step); else { p.style.strokeDasharray=""; p.style.strokeDashoffset=""; res(true); } };
      requestAnimationFrame(step); });
  }
  wait(ms){ const id=this.runId; return new Promise(r=>setTimeout(()=>r(id===this.runId),ms)); }
  local(e){ const pt=this.svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const q=pt.matrixTransform(this.svg.getScreenCTM().inverse()); return [q.x-this.tx, q.y]; }
  down(e){ if(!this.canDraw()) return; e.preventDefault();
    try{ this.svg.setPointerCapture(e.pointerId); }catch(_){}
    this.cur={id:e.pointerId, pts:[this.local(e)]};
    this.cur.path=el("path",{class:this.drawClass||"ink"},this.L.live); this.paint(); }
  move(e){ if(!this.cur||e.pointerId!==this.cur.id) return; e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    (evs.length?evs:[e]).forEach(ev=>this.cur.pts.push(this.local(ev))); this.paint(); }
  up(e){ if(!this.cur||e.pointerId!==this.cur.id) return; const c=this.cur; this.cur=null;
    if(this.onStroke) this.onStroke(c.pts, c.path); }
  paint(){ const p=this.cur.pts; let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
    if(p.length===1) d+=` l0.1 0`; for(let i=1;i<p.length;i++) d+=` L${p[i][0].toFixed(1)} ${p[i][1].toFixed(1)}`;
    this.cur.path.setAttribute("d",d); }
}

/* ---------- 判斷對錯 ---------- */
function densify(pts){ const out=[pts[0]];
  for(let i=1;i<pts.length;i++){ const [x0,y0]=out[out.length-1],[x1,y1]=pts[i]; const L=Math.hypot(x1-x0,y1-y0);
    if(L<0.5) continue; const n=Math.ceil(L/3); for(let k=1;k<=n;k++) out.push([x0+(x1-x0)*k/n, y0+(y1-y0)*k/n]); }
  return out; }
function nearest(p, arr){ let bi=0,bd=1e9; for(let i=0;i<arr.length;i++){ const d=Math.hypot(arr[i][0]-p[0],arr[i][1]-p[1]); if(d<bd){bd=d;bi=i;} } return [bi,bd]; }
function judge(d, raw, tol){
  if(d && d.dot){
    const [tx, ty] = d.dot;
    if(!raw || raw.length === 0) return {ok:false, why:"short"};
    let uLen = 0;
    for(let i=1; i<raw.length; i++) uLen += Math.hypot(raw[i][0]-raw[i-1][0], raw[i][1]-raw[i-1][1]);
    if(uLen >= 30) return {ok:false, why:"off"};
    const [sx, sy] = raw[0];
    if(Math.hypot(sx - tx, sy - ty) > tol * 1.3) return {ok:false, why:"start"};
    return {ok:true};
  }
  const f=info(d), E=f.pts, U=densify(raw);
  const uLen=(U.length-1)*3;
  if(U.length<4 || uLen<f.len*0.35) return {ok:false, why:"short"};
  if(Math.hypot(U[0][0]-f.start[0],U[0][1]-f.start[1])>tol*1.8) return {ok:false, why:"start"};
  const q=k=>nearest(U[Math.round((U.length-1)*k)],E)[0];
  const i1=q(.25), i2=q(.5), i3=q(.75);
  if(!(i1<i2 && i2<i3)) return {ok:false, why:"dir"};
  const cover=E.filter(p=>nearest(p,U)[1]<=tol).length/E.length;
  if(cover<0.8) return {ok:false, why:"short"};
  const off=U.filter(p=>nearest(p,E)[1]>tol*1.5).length/U.length;
  if(off>0.12) return {ok:false, why:"off"};
  return {ok:true};
}
const WHY = { start:"要從橘色的 ① 開始寫喔！", dir:"方向反了，跟著箭頭的方向寫～", short:"還沒寫完喔，要寫到線的尾巴～", off:"有點跑出去了，沿著線慢慢寫～" };

function startStage(st){

async function ghostHint(i){
  board.clear("anim"); await board.animate(i,"ghost",260); if(await board.wait(350)) board.clear("anim"); }

function onStroke(pts, path){
  const strokes=LET[P.ch].s; const d=strokes[P.idx];
  const r=judge(d, pts, TOL[P.stage]);
  if(r.ok){
    if(d && d.dot){
      path.remove();
      el("circle",{cx:d.dot[0],cy:d.dot[1],r:14,class:"ink ok dot-fill"},board.L.done);
    } else {
      path.setAttribute("class","ink ok");
      board.L.done.appendChild(path);
    }
    sfx.good(); P.idx++; P.fails=0;
    if(P.idx>=strokes.length){ levelDone(); return; }
    board.marker(P.idx); coach(PRAISE[Math.floor(Math.random()*PRAISE.length)]+" 換下一筆。","good",strokeSub());
  }else{
    path.setAttribute("class","ink bad"); requestAnimationFrame(()=>path.classList.add("fade")); setTimeout(()=>path.remove(),900);
    sfx.bad(); P.fails++; const b=$("board"); b.classList.remove("shake"); void b.getBBox; requestAnimationFrame(()=>b.classList.add("shake"));
    coach(WHY[r.why],"bad",strokeSub()+(P.fails>=2?"　看橘色的示範再試一次":""));
    if(P.fails>=2) ghostHint(P.idx);
  }
}

  const upper = P.ch===P.pair;
  let nextLabel, nextFn;
  if(st<3){ nextLabel=`下一關：${STAGES[st+1]} →`; nextFn=()=>startStage(st+1); }
  else if(upper){ nextLabel=`換寫小寫 ${P.pair.toLowerCase()} →`; nextFn=()=>setCase(false); }
  else if(starCount(P.pair)<3){ nextLabel=`回去寫大寫 ${P.pair} →`; nextFn=()=>setCase(true); }
  else { nextLabel="回字母牆選下一個 →"; nextFn=()=>show("home"); }
  coach(`第 ${st} 關完成！`,"good","");
  $("nextBtn").textContent=nextLabel; $("nextBtn").hidden=false; $("nextBtn").onclick=nextFn;
  if(!wasPair && pairDone(P.pair)){
    sfx.sticker(); celebrate(`<div class="cele-big">${STICKER[P.pair]}</div>`, `${P.pair}${P.pair.toLowerCase()} 全部完成！`, "得到一張新貼紙，已經貼進貼紙本了。", "回字母牆看貼紙", ()=>show("home"), "再寫一次", ()=>startStage(st), 60);
  } else {
    sfx.star(); celebrate(`<div class="cele-big">${star(true)}</div>`, first?"得到一顆星星！":"又完成一次！", `${P.ch} 的第 ${st} 關：${STAGES[st]}`, nextLabel, nextFn, "再寫一次", ()=>startStage(st), first?28:14);
  }
}

/* ---------- 慶祝畫面 ---------- */
function celebrate(big, title, sub, aLabel, aFn, bLabel, bFn, pieces){
  const c=$("celebrate");
  c.innerHTML=`<div class="cele-card" role="dialog" aria-modal="true">${big}<div class="cele-title">${title}</div><div class="cele-sub">${sub}</div>
   <div class="cele-btns"><button class="btn primary" id="ceA">${aLabel}</button><button class="btn" id="ceB">${bLabel}</button></div></div>`;
  c.hidden=false;
  const close=fn=>()=>{ c.hidden=true; c.innerHTML=""; document.querySelectorAll(".confetti").forEach(x=>x.remove()); fn&&fn(); };
  $("ceA").onclick=close(aFn); $("ceB").onclick=close(bFn); $("ceA").focus();
  const colors=["#EE7A16","#11806F","#F2B705","#2C52CF","#D3443A","#7BC67E"];
  for(let i=0;i<pieces;i++){ const s=document.createElement("span"); s.className="confetti";
    s.style.left=Math.random()*100+"vw"; s.style.background=colors[i%colors.length];
    s.style.animationDuration=(1.6+Math.random()*1.6)+"s"; s.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),4000); }
}

/* ---------- 首頁 ---------- */
function renderHome(){
  const w=$("wall"); w.innerHTML="";
  OPEN.forEach(U=>{
    const L=U.toLowerCase(), done=pairDone(U);
    const t=document.createElement("button");
    t.className="tile"+(done?" done":"");
    t.innerHTML=`${done?`<span class="stk">${STICKER[U]}</span>`:""}<span class="pair"><span>${U}</span><span>${L}</span></span>
      <span class="mini">${prog[U].concat(prog[L]).map(v=>star(v)).join("")}</span>`;
    t.setAttribute("aria-label",`${U}${L}，${starCount(U)+starCount(L)} 顆星`);
    t.addEventListener("click",()=>openPractice(U));
    w.appendChild(t);
  });
  const s=$("slots"); s.innerHTML=""; let got=0;
  OPEN.forEach(U=>{
    const ok=pairDone(U); if(ok) got++;
    const d=document.createElement("div"); d.className="slot"+(ok?" got":"");
    d.innerHTML=`<span class="e">${STICKER[U]}</span><span class="l">${U}${U.toLowerCase()}</span>`; s.appendChild(d);
  });
  $("stkCount").textContent=got;
}
function show(v){ ["home","practice","teacher"].forEach(k=>$(k).hidden=(k!==v)); board.stop(); tb.stop(); window.scrollTo(0,0);
  if(v==="home") renderHome(); }

/* ---------- 老師示範模式 ---------- */
const tb = new Board($("tboard"));
const T = {pair:"A", upper:true, shown:0, pen:false, guide:true, busy:false};
tb.drawClass="tpen"; tb.canDraw=()=>T.pen; tb.onStroke=()=>{};
function tCh(){ return T.upper?T.pair:T.pair.toLowerCase(); }
function tLoad(){ tb.setLetter(tCh()); T.shown=0; T.busy=false; tb.guide(T.guide?2:0); tUpdate();
  document.querySelectorAll(".t-chip").forEach(b=>b.classList.toggle("on",b.dataset.p===T.pair));
  $("tSegU").classList.toggle("on",T.upper); $("tSegL").classList.toggle("on",!T.upper);
  $("tSegU").textContent="大寫 "+T.pair; $("tSegL").textContent="小寫 "+T.pair.toLowerCase(); }
function tUpdate(){ const n=LET[tCh()].s.length; $("tCount").textContent=`${tCh()}　${T.shown} / ${n} 筆`; }
function tRedraw(){ tb.clear("anim"); for(let i=0;i<T.shown;i++) tb.staticStroke(i,"demo"); tb.clear("mark"); tUpdate(); }
async function tNext(){ const n=LET[tCh()].s.length; if(T.busy||T.shown>=n) return;
  T.busy=true; tb.marker(T.shown); const ok=await tb.animate(T.shown,"demo",170); T.busy=false; if(!ok) return;
  tb.clear("mark"); T.shown++; tUpdate(); }
function tPrev(){ tb.stop(); T.busy=false; T.shown=Math.max(0,T.shown-1); tRedraw(); }
async function tAll(){ tb.stop(); T.busy=false; T.shown=0; tRedraw(); const n=LET[tCh()].s.length;
  for(let i=0;i<n;i++){ await tNext(); if(!(await tb.wait(320))) return; } }
function openTeacher(pair){ T.pair=pair||T.pair; show("teacher"); tLoad(); }
$("tChips").innerHTML=OPEN.map(p=>`<button class="t-chip" data-p="${p}">${p}${p.toLowerCase()}</button>`).join("");
$("tChips").addEventListener("click",e=>{ const b=e.target.closest(".t-chip"); if(b){ T.pair=b.dataset.p; tLoad(); } });
$("tSegU").onclick=()=>{ T.upper=true; tLoad(); };
$("tSegL").onclick=()=>{ T.upper=false; tLoad(); };
$("tNext").onclick=tNext; $("tPrev").onclick=tPrev; $("tAll").onclick=tAll;
$("tGuide").onclick=()=>{ T.guide=!T.guide; $("tGuide").classList.toggle("on",T.guide); tb.guide(T.guide?2:0); };
$("tGuide").classList.add("on");
$("tPen").onclick=()=>{ T.pen=!T.pen; $("tPen").classList.toggle("on",T.pen); };
$("tClear").onclick=()=>tb.clear("live");
$("tFull").onclick=()=>{ try{ const r=document.documentElement; (document.fullscreenElement?document.exitFullscreen():r.requestFullscreen()).catch(()=>{}); }catch(e){} };
$("tExit").onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){} show("home"); };
document.addEventListener("keydown",e=>{ if($("teacher").hidden) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); tNext(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); tPrev(); }
  else if(e.key===" "){ e.preventDefault(); tAll(); } });

/* ---------- A4 練習單 ---------- */
const RW=2600;
function rowSVG(inner){ return `<svg class="prow" viewBox="0 -40 ${RW} 380">`+
  [0,100,300].map(y=>`<line x1="0" x2="${RW}" y1="${y}" y2="${y}" class="p-dot"/>`).join("")+
  `<line x1="0" x2="${RW}" y1="200" y2="200" class="p-base"/>${inner}</svg>`; }
function glyph(ch,x,cls){
  return `<g transform="translate(${x} 0)">`+LET[ch].s.map(d=>{
    if(d && d.dot){
      let fill = "#222";
      if(cls==="p-trace") fill="#c4cbd0";
      else if(cls==="p-dash") fill="#7d868c";
      return `<circle cx="${d.dot[0]}" cy="${d.dot[1]}" r="14" fill="${fill}"/>`;
    }
    return `<path d="${d}" class="${cls}"/>`;
  }).join("")+`</g>`;
}
function rowDecomp(ch){ const L=LET[ch]; let x=50, out="";
  L.s.forEach((_,k)=>{ out+=`<g transform="translate(${x} 0)">`;
    L.s.forEach((d,j)=>{
      if(j<=k){
        if(d && d.dot){
          out+=`<circle cx="${d.dot[0]}" cy="${d.dot[1]}" r="14" fill="${j<k?"#222":"#E8730C"}"/>`;
        } else {
          out+=`<path d="${d}" class="${j<k?"p-done":"p-cur"}"/>`;
        }
      }
    });
    const curStroke=L.s[k];
    if(curStroke && curStroke.dot){
      const [sx,sy]=curStroke.dot;
      out+=`<circle cx="${sx}" cy="${sy}" r="17" class="p-nc"/><text x="${sx}" y="${sy+1}" class="p-nt">${k+1}</text></g>`;
    } else {
      const f=info(curStroke); const [sx,sy]=f.start, [ax,ay,ang]=f.arrow;
      out+=`<polygon points="-10,-10 12,0 -10,10" class="p-nc" transform="translate(${ax} ${ay}) rotate(${ang})"/>`;
      out+=`<circle cx="${sx}" cy="${sy}" r="17" class="p-nc"/><text x="${sx}" y="${sy+1}" class="p-nt">${k+1}</text></g>`;
    }
    x+=L.w+150; });
  return out; }
function rowRepeat(ch,cls,firstModel){ const w=LET[ch].w, step=w+95; let out="", i=0;
  for(let x=50; x+w<RW-30; x+=step, i++){ if(cls) out+=glyph(ch,x,cls); else if(i===0&&firstModel) out+=glyph(ch,x,"p-model"); }
  return out; }
function sheetHTML(U){ const L=U.toLowerCase();
  const sec=(ch,name)=>`<div class="p-sec">${name} <b>${ch}</b></div>`+
    [["筆順",rowDecomp(ch)],["描寫",rowRepeat(ch,"p-trace")],["虛線",rowRepeat(ch,"p-dash")],["自己寫",rowRepeat(ch,null,true)]]
    .map(([lab,inner])=>`<div class="p-row"><div class="p-lab">${lab}</div>${rowSVG(inner)}</div>`).join("");
  return `<div class="page"><div class="p-head"><div class="p-title">英文字母書寫練習<b>${U}${L}</b></div><div class="p-name">座號＿＿＿　姓名＿＿＿＿＿＿＿</div></div>
    <div class="p-tip">第 3 條線是實線（基線），字母要坐在實線上。橘色是這一筆，數字是第幾筆。</div>${sec(U,"大寫")}${sec(L,"小寫")}</div>`; }

let curSheetList = OPEN;
function openSheets(list){
  curSheetList = list || OPEN;
  // 更新選單
  const sel = $("sheetSelect");
  sel.innerHTML = `<option value="ALL">全部 26 張</option>` + OPEN.map(u => `<option value="${u}">${u}${u.toLowerCase()}</option>`).join("");
  if(list.length === 1) sel.value = list[0]; else sel.value = "ALL";

  renderModalPages();
  $("sheetModal").hidden=false; fitSheets();
}
function renderModalPages(){
  const box=$("smPages");
  box.innerHTML=curSheetList.map(U=>`<div class="page-wrap">${sheetHTML(U)}</div>`).join("");
  fitSheets();
}
function fitSheets(){ const box=$("smPages"); if($("sheetModal").hidden) return;
  const pw=793.7, ph=1122.5, s=Math.min(1, box.clientWidth/pw);
  box.querySelectorAll(".page-wrap").forEach(w=>{ w.style.height=ph*s+"px"; w.style.width=pw*s+"px"; w.firstElementChild.style.transform=`scale(${s})`; }); }
window.addEventListener("resize",fitSheets);
$("sheetSelect").addEventListener("change", e=>{
  const val = e.target.value;
  curSheetList = (val === "ALL") ? OPEN : [val];
  renderModalPages();
});
$("smPrint").onclick=()=>{
  window.__buildPrint(curSheetList);
  window.print();
};
$("smClose").onclick=()=>{ $("sheetModal").hidden=true; $("smPages").innerHTML=""; };
window.__buildPrint=list=>{ $("printArea").innerHTML=(list||OPEN).map(sheetHTML).join(""); };

/* ---------- 事件 ---------- */
$("backHome").onclick=()=>show("home");
$("segU").onclick=()=>setCase(true);
$("segL").onclick=()=>setCase(false);
$("replayBtn").onclick=async()=>{ if(P.stage===0){ startStage(0); return; }
  if(P.busy) return; P.busy=true; board.clear("mark"); const n=LET[P.ch].s.length;
  for(let i=0;i<n;i++){ if(!await board.animate(i,"ghost",260)) return; }
  await board.wait(400); board.clear("anim"); P.busy=false; if(P.idx<n) board.marker(P.idx); };
$("restartBtn").onclick=()=>startStage(P.stage||1);
$("sheetBtn").onclick=()=>openSheets([P.pair]);
$("allSheets").onclick=()=>openSheets(OPEN);
$("toTeacher").onclick=()=>openTeacher("A");
let resetArmed=false;
$("resetBtn").onclick=()=>{ if(!resetArmed){ resetArmed=true; $("resetBtn").textContent="再按一次就清除"; setTimeout(()=>{resetArmed=false; $("resetBtn").textContent="清除這台裝置的紀錄";},4000); return; }
  prog={}; try{ localStorage.removeItem(KEY); }catch(e){} load(); resetArmed=false; $("resetBtn").textContent="已清除"; renderHome(); };

load(); renderHome();
window.__app={LET,info,judge,openPractice,openTeacher,startStage,setCase,openSheets,P,T,board,tb,prog:()=>prog};
})();
</script>
